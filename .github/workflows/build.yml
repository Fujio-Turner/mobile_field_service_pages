name: Build docs HTML
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pandoc/actions/setup@v1
      - run: python3 scripts/build.py
      - name: Upload public/
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public
      - name: Commit rebuilt public/ on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'rebuild public')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --staged --quiet; then
            echo "public/ unchanged"
          else
            git commit -m "chore: rebuild public/ from content"
            git push
          fi
