<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>og</title>
  <!-- Copy to public/_og.html and screenshot at 1200×630 → public/images/og.png -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #0f766e; }
    .card {
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: linear-gradient(160deg, #115e59 0%, #0f766e 42%, #134e4a 100%);
      color: #f8fafc;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      position: relative;
    }
    .copy {
      padding: 64px 28px 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.01em;
      color: #ccfbf1;
    }
    .brand svg { display: block; }
    h1 {
      margin-top: 28px;
      font-size: 46px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 18ch;
    }
    .pills {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pills span {
      background: rgba(204, 251, 241, 0.16);
      border: 1px solid rgba(204, 251, 241, 0.35);
      color: #ccfbf1;
      font-size: 15px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .url {
      margin-top: 36px;
      font-size: 20px;
      font-weight: 600;
      color: #99f6e4;
    }
    .phone-wrap {
      position: relative;
      overflow: hidden;
    }
    .phone-wrap img {
      position: absolute;
      width: 340px;
      height: auto;
      right: 72px;
      top: 36px;
      border-radius: 36px;
      box-shadow: 0 28px 64px rgba(15, 23, 42, 0.45);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#ccfbf1"/>
          <rect x="10" y="7" width="12" height="18" rx="2.2" fill="none" stroke="#0f766e" stroke-width="2"/>
          <path d="M13 16.5h6M13 20.5h4" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Mobile Field Service
      </div>
      <h1>Work in the field. Even when there is no signal.</h1>
      <div class="pills">
        <span>Sync</span>
        <span>Chat</span>
        <span>Notes</span>
        <span>Maps</span>
        <span>Stock</span>
      </div>
      <p class="url">mobile.fuj.io</p>
    </div>
    <div class="phone-wrap">
      <img src="images/Home-Jobs-Workorders-Today.png" alt="" width="340" />
    </div>
  </div>
</body>
</html>
